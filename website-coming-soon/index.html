<!DOCTYPE html>
<html lang="pt-AO">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Em breve - Página inicial</title>
	<link rel="stylesheet" type="text/css" href="./css/style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
	<main class="container">
		<img src="img/logo.png" alt="Logo website" class="logo">

		<section class="content">
			<p>O site está em manutenção</p>
			<h1>Lançaremos <span>em breve</span></h1>
			<div class="launch-time">
				<div>
					<p id="days">00</p>
					<span>Dias</span>
				</div>
				<div>
					<p id="hours">00</p>
					<span>Horas</span>
				</div>
				<div>
					<p id="minutes">00</p>
					<span>Minutos</span>
				</div>
				<div>
					<p id="seconds">00</p>
					<span>Segundos</span>
				</div>
			</div>

			<a href="#" class="btn">Saiba mais <i class="fa-solid fa-angle-right"></i></a>
		</section>

		<img src="img/rocket.png" alt="Rocket" class="rocket">
	</main>

	<script type="text/javascript" src="./js/script.js"></script>
</body>
</html>
